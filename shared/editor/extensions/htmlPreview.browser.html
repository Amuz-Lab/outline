<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HTML Preview browser regression</title>
    <style>
      body {
        margin: 0;
        font: 14px system-ui;
        background: #18191b;
        color: #eee;
      }
      nav {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
        padding: 8px;
        background: #18191b;
      }
      #editor {
        width: 800px;
        margin: 64px auto;
      }
      .outline-html-preview {
        padding: 12px;
        border: 1px solid #555;
      }
      .outline-html-preview-toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .outline-html-preview-frame {
        position: relative;
        margin: 0 auto;
      }
      .outline-html-preview-resize {
        position: absolute;
        z-index: 1;
        touch-action: none;
      }
      .outline-html-preview-resize-width {
        right: -6px;
        top: 50%;
        width: 12px;
        height: 44px;
      }
      .outline-html-preview-resize-height {
        bottom: -6px;
        left: 50%;
        width: 44px;
        height: 12px;
      }
      .outline-html-preview-resize-both {
        right: -6px;
        bottom: -6px;
        width: 20px;
        height: 20px;
      }
      button {
        min-height: 24px;
      }
    </style>
    <script>
      window.env = {};
    </script>
  </head>
  <body>
    <nav>
      <button id="edit">Edit</button><button id="done">Done editing</button
      ><button id="undo">Undo</button>
    </nav>
    <div id="editor"></div>
    <script type="module" src="./htmlPreview.browser.ts"></script>
  </body>
</html>
